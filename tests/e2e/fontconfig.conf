<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  chrome-headless-shell aborts in Skia when a rendered glyph asks for a system
  fallback and fontconfig has no default configuration. The app ships every
  face it renders (Inter, Material Icons and Vazirmatn), so point fontconfig at
  those files. The directory is relative to the repository root, where the
  Playwright suite is run.
-->
<fontconfig>
  <dir>public/fonts</dir>
  <cachedir>/tmp/memora-fontconfig-cache</cachedir>
</fontconfig>
